<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un poco de historia</title><link rel="stylesheet" href="estilo.css"></head><body>
<div class="contenedor">
<header class="cab">
<a class="logo" href="index.html" title="Inicio">UPH</a><!-- logo: sustituye UPH por <img src="logo.png" alt="Un poco de historia"> -->
<div class="tit"><h1>Un poco de historia</h1><p>Mi trayectoria con la informática, entre la historia de la máquina y la mía.</p></div>
<input id="q" type="search" placeholder="Buscar…"></header>
<nav class="menu" id="menu"></nav>
<div class="cuerpo" id="cuerpo"><main id="vista"></main>
<aside class="lat" id="lat"><h3>Años</h3><div class="anios" id="anios"></div></aside></div>
<footer>Las fechas históricas marcadas «a verificar» están pendientes de comprobar. Los trabajos para la empresa solo se nombran, sin documentos.</footer>
<script src="visor.js"></script>
<script>
const SECC=[["linea","Línea temporal"],["hilos","Hilos"],["obras","Obras"],["programas","Programas"]];
const CAMPOS=[["historia","Historia"],["personal","Mi vida personal"],["laboral","Mi vida laboral"],["formacion","Mi formación"],["informatica","Hitos, proyectos y eventos"],["so","Sistema operativo"],["programas","Programas más relevantes"],["enlaces","Archivo y enlaces"]];
let D,GAL={},actual="linea";
const slug=s=>s.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function fotos(refs){const d=el("div","fotos");refs.split(",").forEach(r=>{const [gal,...x]=r.trim().split("/"),a=x.join("/").toLowerCase(),g=GAL[slug(gal)],i=g?g.items.findIndex(o=>(o.origen||"").toLowerCase()==a||(o.origen||"").toLowerCase().replace(/\.[^.]+$/,"")==a):-1;d.append(i>=0?Visor.tarjeta(g.items[i],g.items,i):el("span","ok","[foto no encontrada: "+r.trim()+"]"))});return d}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function texto(s){const f=document.createDocumentFragment();s.split("\n").forEach(l=>{const mf=l.trim().match(/^\{foto:\s*(.+?)\s*\}$/i);if(mf){f.append(fotos(mf[1]));return}const p=el("p");l.split(/(\[[^\]]+\]\([^)\s]+\)|(?:https?:\/\/|galeria\.html\?)[^\s|]+)/).forEach(x=>{
const m=x.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/),u=m?m[2]:x;
if(m||/^(https?:|galeria\.html)/.test(x)){const web=/^https?:\/\//.test(u),ok=web||/^galeria\.html\?/.test(u)||/^#a\d+$/.test(u);
if(!ok){p.append(m?m[1]:x);return}
const a=el("a",0,m?m[1]:(web?x.replace(/^https?:\/\/(www\.)?/,"").slice(0,60):"Ver galería"));a.href=u;if(web){a.target="_blank";a.rel="noopener"}p.append(a)}else p.append(x)});f.append(p)});return f}
function linea(){const v=document.createDocumentFragment();D.anios.forEach(a=>{const r=el("article");r.id="a"+a.anio;r.append(el("h2",0,a.anio));
CAMPOS.forEach(([k,n])=>{if(a[k]){r.append(el("h3",0,n));r.append(texto(a[k]));if(k=="historia"&&a.fuente)r.append(el("span","ok","fuente verificada"))}});v.append(r)});return v}
function hilos(){const v=document.createDocumentFragment();D.hilos.forEach(h=>{const r=el("article");r.append(el("h2",0,h.hilo));r.append(texto(h.texto));if(h.anios)r.append(el("h3",0,"Años: "+h.anios));v.append(r)});return v}
function obras(){const v=document.createDocumentFragment();D.obras.forEach(o=>{const r=el("article");r.append(el("h2",0,o.obra));r.append(el("p",0,[o.tipo,o.fecha,o.plataforma].filter(Boolean).join(" · ")));if(o.enlace.startsWith("http")){const a=el("a",0,"Ver");a.href=o.enlace;a.target="_blank";a.rel="noopener";r.append(a)}v.append(r)});return v}
function programas(){const v=document.createDocumentFragment();D.programas.forEach(g=>{const r=el("article");r.append(el("h2",0,g.programa));r.append(el("p",0,[g.fabricante,g.uso].filter(Boolean).join(" · ")));if(g.versiones)r.append(el("p",0,"Versiones: "+g.versiones));if(g.anios)r.append(el("p",0,"Años de uso: "+g.anios));v.append(r)});return v}
function pintar(){document.getElementById("vista").replaceChildren({linea,hilos,obras,programas}[actual]());
document.getElementById("lat").hidden=actual!="linea";document.getElementById("cuerpo").classList.toggle("solo",actual!="linea");filtrar()}
function filtrar(){const q=document.getElementById("q").value.toLowerCase();document.querySelectorAll("#vista article").forEach(a=>a.hidden=q&&!a.textContent.toLowerCase().includes(q))}
const menu=document.getElementById("menu");
SECC.forEach(([k,n])=>{const b=el("button",0,n);b.setAttribute("aria-pressed",k==actual);b.onclick=()=>{actual=k;menu.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));pintar()};menu.append(b)});
document.getElementById("q").oninput=filtrar;
Promise.all([fetch("datos.json").then(r=>r.json()),fetch("galerias.json").then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,g])=>{D=d;GAL=g;D.anios.forEach(a=>{const l=el("a",0,a.anio);l.href="#a"+a.anio;document.getElementById("anios").append(l)});pintar()}).catch(()=>{document.getElementById("vista").textContent="No se pudo cargar datos.json."});
</script></div></body></html>
